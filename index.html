<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMIRREZA | PROGRAMMER</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        background: #050505;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: #222;
        filter: blur(180px);
        border-radius: 50%;
        opacity: 0.5;
    }

    .card {
        position: relative;
        width: 90%;
        max-width: 400px;
        padding: 45px 25px;
        text-align: center;

        background: rgba(15,15,15,0.85);
        border: 1px solid #333;
        border-radius: 25px;

        box-shadow:
            0 0 20px rgba(255,255,255,0.05),
            0 20px 60px rgba(0,0,0,0.8);

        animation: show 1s ease;
    }

    .line {
        width: 60px;
        height: 3px;
        background: white;
        margin: 20px auto;
        border-radius: 10px;
    }

    h1 {
        font-size: 42px;
        letter-spacing: 8px;
    }

    h2 {
        font-size: 14px;
        font-weight: normal;
        letter-spacing: 6px;
        color: #888;
        margin-top: 12px;
    }

    .tap {
        margin-top: 35px;
        color: #777;
        font-size: 12px;
        letter-spacing: 3px;
    }

    .phone {
        margin-top: 25px;
        color: #aaa;
        font-size: 18px;
        letter-spacing: 2px;
    }

    .call {
        display: block;
        margin-top: 30px;
        padding: 16px;

        border-radius: 15px;

        background: white;
        color: black;

        text-decoration: none;
        font-weight: bold;
        letter-spacing: 2px;

        transition: 0.3s;
    }

    .call:hover {
        transform: scale(1.04);
        background: #ddd;
    }

    .bottom {
        margin-top: 30px;
        font-size: 10px;
        color: #444;
        letter-spacing: 3px;
    }

    @keyframes show {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

</head>

<body>

<div class="card">

<h1>AMIR</h1>

<div class="line"></div>

<h2>PROGRAMMER</h2>

<p class="tap">DON'T ASK. JUST TAP.</p>

<p class="phone">0914 232 0522</p>

<a class="call" href="tel:+989142320522">
    CALL ME 📞
</a>

<p class="bottom">
    NFC DIGITAL CARD
</p>
</div>

</body>
</html>
